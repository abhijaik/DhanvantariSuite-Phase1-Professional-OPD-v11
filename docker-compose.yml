version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: clinic_erp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: clinic_erp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema_postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  postgres_data:
