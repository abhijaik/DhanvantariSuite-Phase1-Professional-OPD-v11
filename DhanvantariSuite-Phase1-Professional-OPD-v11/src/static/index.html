<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dhanvantari Clinic ERP</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--blue:#2563eb;--blue2:#1d4ed8;--green:#059669;--red:#dc2626;--amber:#d97706;--ink:#172033;--muted:#64748b;--line:#e5e7eb;--bg:#f5f7fb;--card:#fff}
*{box-sizing:border-box}body{margin:0;font-family:"Aptos","Segoe UI",Roboto,Arial,sans-serif;letter-spacing:-.005em;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.hidden{display:none!important}
#app{min-height:100vh}.layout{display:flex;min-height:100vh}.sidebar{width:225px;background:#fff;border-right:1px solid var(--line);padding:20px 14px;position:fixed;inset:0 auto 0 0;z-index:10}.brand{font-size:19px;font-weight:800;line-height:1.1;margin:4px 10px 26px}.brand span{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--blue);color:white;margin-right:8px}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;text-align:left;padding:12px 13px;border-radius:10px;color:#475569;cursor:pointer;font-weight:650}.nav button.active,.nav button:hover{background:#edf4ff;color:var(--blue)}.profile{position:absolute;bottom:16px;left:14px;right:14px;border-top:1px solid var(--line);padding:13px 10px}.profile b{display:block}.profile small{color:var(--muted)}.main{margin-left:225px;width:calc(100% - 225px)}.topbar{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:8}.page-title{font-size:20px;font-weight:800}.status{font-size:12px;color:var(--muted)}.content{padding:24px;max-width:1500px;margin:auto}.grid{display:grid;gap:16px}.grid-4{grid-template-columns:repeat(4,1fr)}.grid-2{grid-template-columns:1.5fr 1fr}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:0 4px 18px rgba(15,23,42,.035)}.card h3{margin:0 0 14px;font-size:16px}.stat{padding:16px}.stat small{color:var(--muted)}.stat strong{font-size:28px;display:block;margin-top:4px}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:10px 14px;cursor:pointer;font-weight:700}.btn:hover{box-shadow:0 4px 12px rgba(15,23,42,.08)}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.btn.success{background:var(--green);border-color:var(--green);color:white}.btn.warn{background:#fff7ed;border-color:#fed7aa;color:#9a3412}.btn.danger{background:#fef2f2;border-color:#fecaca;color:#b91c1c}.btn.small{padding:7px 9px;font-size:12px}.input,.select,.textarea{width:100%;border:1px solid #d7dee8;border-radius:9px;padding:10px 11px;background:#fff;outline:none}.input:focus,.select:focus,.textarea:focus{border-color:#9db7ff;box-shadow:0 0 0 3px #eff6ff}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#64748b;font-weight:800;display:block;margin-bottom:6px}.field.full{grid-column:1/-1}.hint{font-size:12px;color:var(--muted);margin-top:5px}.required:after{content:' *';color:var(--red)}.banner{padding:12px 14px;border-radius:10px;background:#eff6ff;color:#1e40af;font-size:13px;margin-bottom:14px}.banner.warn{background:#fff7ed;color:#9a3412}.patient-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.patient-head h2{margin:0;font-size:20px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.chip{font-size:11px;padding:4px 8px;border-radius:99px;background:#f1f5f9;color:#475569}.chip.blue{background:#eff6ff;color:#1d4ed8}.chip.green{background:#ecfdf5;color:#047857}.chip.amber{background:#fffbeb;color:#92400e}.queue-row{display:grid;grid-template-columns:70px 1.4fr 1fr 100px 180px;gap:12px;align-items:center;border:1px solid var(--line);padding:12px;border-radius:11px;margin-bottom:8px}.token{font-size:19px;font-weight:900;color:var(--blue)}.row-actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}.empty{text-align:center;color:var(--muted);padding:30px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.table th{color:var(--muted);font-size:11px;text-transform:uppercase}.modal{position:fixed;inset:0;background:rgba(15,23,42,.38);display:grid;place-items:center;padding:20px;z-index:30}.modalbox{background:white;border-radius:16px;max-width:900px;width:100%;max-height:92vh;overflow:auto;padding:22px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modalhead h2{margin:0}.close{border:0;background:#f1f5f9;border-radius:8px;width:34px;height:34px;cursor:pointer}.history{display:grid;gap:10px}.visit{border-left:3px solid #c7d2fe;background:#f8fafc;padding:11px;border-radius:0 9px 9px 0}.login{position:fixed;inset:0;background:linear-gradient(135deg,#eff6ff,#f8fafc);display:grid;place-items:center;z-index:50}.loginbox{width:min(430px,92vw);background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 20px 50px rgba(15,23,42,.12)}.loginbox h1{margin:0 0 5px}.loginbox p{color:var(--muted);margin:0 0 22px}.loginbox .field{margin-bottom:13px}.quick{display:flex;gap:7px;margin-top:12px}.toast{position:fixed;right:20px;bottom:20px;background:#172033;color:#fff;padding:12px 15px;border-radius:10px;z-index:60;max-width:420px;box-shadow:0 10px 25px rgba(0,0,0,.18)}.doctor-layout{display:grid;grid-template-columns:330px 1fr;gap:16px}.queue-list{max-height:calc(100vh - 190px);overflow:auto}.queue-card{padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer}.queue-card.selected{border-color:#9db7ff;background:#eff6ff}.queue-card b{font-size:15px}.consult-section{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}.medrow{display:grid;grid-template-columns:1.8fr 1.2fr 1fr 1.1fr 1.4fr 36px;gap:6px;margin-bottom:7px}.med-suggest-box{position:absolute;top:calc(100% + 4px);left:0;min-width:320px;max-width:460px;background:#fff;border:1px solid #cbd5e1;border-radius:10px;box-shadow:0 14px 30px rgba(15,23,42,.15);max-height:240px;overflow-y:auto;z-index:99}.med-suggest-item{padding:8px 12px;cursor:pointer;border-bottom:1px solid #f1f5f9;display:flex;flex-direction:column;align-items:flex-start;gap:3px;font-size:13px;transition:background .15s}.med-suggest-item:last-child{border-bottom:0}.med-suggest-item:hover,.med-suggest-item.active{background:#edf4ff;color:var(--blue2)}.med-suggest-item .med-meta{font-size:11px;color:#64748b}.money{font-size:25px;font-weight:900}.subtle{color:var(--muted)}.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#94a3b8;margin-right:6px}.status-text{font-weight:800}.status-scheduled{background:#f1f5f9;color:#475569}.status-waiting{background:#fffbeb;color:#92400e}.status-consulting{background:#ecfdf5;color:#047857}.status-completed{background:#eff6ff;color:#1d4ed8}.status-cancelled{background:#fef2f2;color:#b91c1c}.doctor-filter{max-width:240px}@media(max-width:1000px){.sidebar{width:70px}.brand strong,.nav button span,.profile div{display:none}.main{margin-left:70px;width:calc(100% - 70px)}.grid-4{grid-template-columns:repeat(2,1fr)}.grid-2,.doctor-layout{grid-template-columns:1fr}.queue-row{grid-template-columns:60px 1fr;}.row-actions{justify-content:flex-start}.formgrid{grid-template-columns:1fr}}@media(max-width:600px){.content{padding:14px}.grid-4{grid-template-columns:1fr}.topbar{padding:0 14px}.formgrid{grid-template-columns:1fr}.queue-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="login" class="login">
  <div class="loginbox">
    <h1>Dhanvantari Clinic ERP</h1><p>Simple OPD • Consultation • Billing</p>
    <form onsubmit="login(event)">
      <div class="field"><label>Username</label><input id="login-user" class="input" required autofocus></div>
      <div class="field"><label>Password</label><input id="login-pass" type="password" class="input" required></div>
      <button class="btn primary" style="width:100%">Login</button>
    </form>
    <div class="quick"><button class="btn small" onclick="fillLogin('doctor_user','docpass123')">Doctor demo</button><button class="btn small" onclick="fillLogin('receptionist_user','receppass123')">Reception demo</button><button class="btn small" onclick="fillLogin('admin_user','adminpass123')">Admin demo</button></div>
  </div>
</div>
<div id="app" class="hidden">
  <div class="layout">
    <aside class="sidebar"><div class="brand"><span><i class="fa-solid fa-plus"></i></span><strong>Dhanvantari<br>Clinic ERP</strong></div><nav id="nav" class="nav"></nav><div class="profile"><b id="me-name"></b><small id="me-role"></small><button class="btn small" style="width:100%;margin-top:9px" onclick="logout()">Logout</button></div></aside>
    <main class="main"><header class="topbar"><div class="page-title" id="page-title">Today</div><div class="status"><i class="fa-solid fa-circle" style="color:#10b981;font-size:9px"></i> Local / LAN ready</div></header><div id="content" class="content"></div></main>
  </div>
</div>
<div id="modal" class="modal hidden"></div><div id="toast" class="toast hidden"></div>
<script>
const API_BASE='';let token='',role='',name='',uid='',canPay=false,canVitals=false,canClinicalView=false,canClinicalEdit=false,doctors=[],currentAppt=null,currentPatient=null,pollTimer=null,lastAuto='';
const SUBTYPES={
 'Gynecology Consultation':['General Gynecology','Menstrual Problems','PCOS / PCOD','Menopause','Infection / Discharge'],
 'Fertility Consultation':['Fertility Evaluation','Ovulation Tracking','Infertility Treatment','Fertility Follow-up'],
 'Pregnancy Consultation':['Pregnancy Confirmation','Antenatal Check-up','High Risk Pregnancy','Postnatal Follow-up'],
 'PCOS / PCOD Clinic':['New PCOS Case','PCOS Follow-up','Weight Management','Lifestyle Counseling'],
 'Follow-up Consultation':['Treatment Follow-up','Lab Follow-up','Post Procedure Follow-up']
};
function headers(){return {'Content-Type':'application/json','Authorization':'Bearer '+token}}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.add('hidden'),3200)}
function fillLogin(u,p){document.getElementById('login-user').value=u;document.getElementById('login-pass').value=p}
async function api(url,opt={}){const r=await fetch(API_BASE+url,{...opt,headers:{...headers(),...(opt.headers||{})}});if(r.status===401){logout();throw new Error('Session expired. Please login again.')}let d=null;try{d=await r.json()}catch{try{d=await r.text()}catch{}}if(!r.ok){let msg='Request failed';if(typeof d==='string'&&d.trim())msg=d;else if(d?.detail){if(typeof d.detail==='string')msg=d.detail;else if(Array.isArray(d.detail))msg=d.detail.map(x=>x.msg||JSON.stringify(x)).join(', ');else msg=JSON.stringify(d.detail)}throw new Error(msg)}return d}
async function login(e){e.preventDefault();try{const body=new URLSearchParams({username:document.getElementById('login-user').value,password:document.getElementById('login-pass').value});const r=await fetch(API_BASE+'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});const d=await r.json();if(!r.ok)throw new Error(d.detail||'Invalid login');token=d.access_token;role=d.role;name=d.full_name;uid=d.user_id;canPay=d.can_collect_payment;canVitals=d.can_enter_vitals;canClinicalView=d.can_view_clinical_history;canClinicalEdit=d.can_edit_clinical_data;localStorage.setItem('dhan_session',JSON.stringify({token,role,name,uid,canPay,canVitals,canClinicalView,canClinicalEdit}));document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');await boot()}catch(err){toast(err.message)}}
function logout(){localStorage.removeItem('dhan_session');token='';document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden');if(pollTimer)clearInterval(pollTimer)}
async function boot(){document.getElementById('me-name').textContent=name;document.getElementById('me-role').textContent=role;await loadDoctors();renderNav();await show('today');startPolling()}
async function loadDoctors(){try{doctors=await api('/api/auth/doctors')}catch(e){doctors=[]}}
function multi(){return doctors.length>1}
let todayQueueData=[];
function renderNav(){const nav=document.getElementById('nav');const items=[['today','Today','fa-house'],['patients','Patients','fa-user-group']];if(role==='DOCTOR')items.push(['consult','Consultation','fa-user-doctor']);items.push(['billing','Billing','fa-receipt']);if(role==='ADMIN')items.push(['admin','Admin','fa-gear']);nav.innerHTML=items.map((x,i)=>`<button data-tab="${x[0]}" onclick="show('${x[0]}')"><i class="fa-solid ${x[2]}"></i> <span>${x[1]}</span></button>`).join('')}
async function show(tab){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.getElementById('page-title').textContent={today:'Today / OPD',patients:'Patients',consult:'Doctor Consultation',billing:'Billing',admin:'Administration'}[tab]||'Today';const c=document.getElementById('content');if(tab==='today')return renderToday(c);if(tab==='patients')return renderPatients(c);if(tab==='consult')return renderConsult(c);if(tab==='billing')return renderBilling(c);if(tab==='admin')return renderAdmin(c)}
async function queue(){return api('/api/queue/live/details')}
async function renderToday(c){let data=[];try{data=await queue()}catch(e){c.innerHTML=`<div class="banner warn">${e.message}</div>`;return}todayQueueData=data;const waiting=data.filter(x=>['IN_QUEUE','CHECKED_IN'].includes(x.appointment.status)).length,consulting=data.filter(x=>x.appointment.status==='CONSULTING').length,scheduled=data.filter(x=>['BOOKED','SCHEDULED'].includes(x.appointment.status)).length;const quick=`<button class="btn primary" onclick="newPatient()">+ New Patient</button><button class="btn" onclick="openPatientSearch()">Find Patient</button><button class="btn" onclick="bookAppointmentModal()">Appointments</button>`;const doctorFilter=(role!=='DOCTOR'&&multi())?`<select id="today-doctor-filter" class="select doctor-filter" onchange="filterTodayQueue()"><option value="">All doctors</option>${doctors.map(d=>`<option value="${d.id}">${d.full_name}</option>`).join('')}</select>`:'';c.innerHTML=`<div class="grid grid-4"><div class="card stat"><small>Scheduled</small><strong id="stat-scheduled">${scheduled}</strong></div><div class="card stat"><small>Waiting</small><strong id="stat-waiting">${waiting}</strong></div><div class="card stat"><small>In Consultation</small><strong id="stat-consulting">${consulting}</strong></div><div class="card stat"><small>Today's Visits</small><strong id="stat-total">${data.length}</strong></div></div><div class="card" style="margin-top:16px"><div class="patient-head"><div><h2>Today's OPD</h2><div class="subtle">${role==='DOCTOR'?'Your patients today':multi()?'All doctors • Today’s patients':'Today’s patients'}</div></div><div class="actions">${quick}</div></div><div class="actions" style="margin-top:15px"><input id="today-search" class="input" style="max-width:520px" placeholder="Search by patient name, mobile, ID or token" oninput="filterTodayQueue()">${doctorFilter}</div></div><div class="card" style="margin-top:16px"><h3>Patients</h3><div id="queue-area">${queueHtml(data)}</div></div>`}
function filterTodayQueue(){const q=(document.getElementById('today-search')?.value||'').trim().toLowerCase();const doctor=(document.getElementById('today-doctor-filter')?.value||'');let filtered=todayQueueData.filter(x=>!doctor||x.appointment.doctor_id===doctor);if(q)filtered=filtered.filter(x=>{const a=x.appointment,p=x.patient||{};return [p.full_name,p.patient_number,p.mobile_normalized,a.queue_token,a.visit_type,a.consultation_type,x.doctor_name,a.status,a.referred_by_name].some(v=>String(v||'').toLowerCase().includes(q))});const area=document.getElementById('queue-area');if(area)area.innerHTML=queueHtml(filtered)}
function statusLabel(st){return ({BOOKED:'Scheduled',SCHEDULED:'Scheduled',CHECKED_IN:'Waiting',IN_QUEUE:'Waiting',CONSULTING:'In Consultation',COMPLETED:'Consultation Completed',CANCELLED:'Cancelled'})[st]||st.replaceAll('_',' ')}
function statusClass(st){if(st==='CONSULTING')return 'status-consulting';if(['CHECKED_IN','IN_QUEUE'].includes(st))return 'status-waiting';if(st==='COMPLETED')return 'status-completed';if(st==='CANCELLED')return 'status-cancelled';return 'status-scheduled'}
function queueHtml(data){if(!data.length)return '<div class="empty">No patients found for today.</div>';return data.map(x=>{const a=x.appointment,p=x.patient;let action='';if(['BOOKED','SCHEDULED'].includes(a.status)&&(['RECEPTIONIST','ADMIN'].includes(role)))action=`<button class="btn small primary" onclick="checkin('${a.id}')">Check-in</button>`;if(['IN_QUEUE','CHECKED_IN'].includes(a.status)&&role==='DOCTOR')action=`<button class="btn small primary" onclick="startConsult('${a.id}')">Open Patient</button>`;if(a.status==='CONSULTING'&&role==='DOCTOR')action=`<button class="btn small" onclick="openConsult('${a.id}')">Continue</button>`;if(canVitals&&['BOOKED','SCHEDULED','CHECKED_IN','IN_QUEUE'].includes(a.status))action+=`<button class="btn small" onclick="vitals('${a.id}')">Vitals</button>`;if(canClinicalView||role==='DOCTOR'||role==='ADMIN')action+=`<button class="btn small" onclick="openPatientHistoryModal('${p?.id}','${(p?.full_name||'').replace(/'/g,"\\'")}')"><i class="fa-solid fa-clock-rotate-left"></i> History</button>`;const referral=a.referred_by_name?`<div class="subtle">Referred by: ${a.referred_by_name}</div>`:'';return `<div class="queue-row"><div>${a.queue_token?`<div class="token">${a.queue_token}</div>`:'<span class="chip green">Direct</span>'}</div><div><b>${p?.full_name||'Patient'}</b><div class="subtle">${p?.patient_number||''} • ${p?.mobile_normalized||''}</div></div><div><span class="chip blue">${a.visit_type}</span> <span class="chip">${a.consultation_type}</span><div class="subtle">${x.doctor_name||''}</div>${referral}</div><div><span class="chip ${statusClass(a.status)}"><span class="status-dot"></span>${statusLabel(a.status)}</span></div><div class="row-actions">${action}</div></div>`}).join('')}
async function startPolling(){if(pollTimer)clearInterval(pollTimer);pollTimer=setInterval(async()=>{try{const data=await queue();todayQueueData=data;if(document.getElementById('queue-area')&&document.getElementById('page-title').textContent==='Today / OPD'){filterTodayQueue();const waiting=data.filter(x=>['IN_QUEUE','CHECKED_IN'].includes(x.appointment.status)).length,consulting=data.filter(x=>x.appointment.status==='CONSULTING').length,scheduled=data.filter(x=>['BOOKED','SCHEDULED'].includes(x.appointment.status)).length;['scheduled','waiting','consulting','total'].forEach((k,i)=>{const el=document.getElementById('stat-'+k);if(el)el.textContent=[scheduled,waiting,consulting,data.length][i]})}if(role==='DOCTOR'){const n=data.find(x=>(x.appointment.status==='IN_QUEUE'||x.appointment.status==='CHECKED_IN')&&x.appointment.id!==lastAuto);if(n&&!currentAppt){lastAuto=n.appointment.id;await startConsult(n.appointment.id,true)}}}catch(e){}} ,3000)}
async function checkin(id){try{const d=await api('/api/queue/'+id+'/checkin',{method:'POST'});toast(d.queue_token?`Patient checked in • ${d.queue_token}`:'Patient checked in.');await show('today')}catch(e){toast(e.message)}}
function newPatient(){openModal(`<div class="modalbox"><div class="modalhead"><div><h2>New Patient</h2><div class="subtle">Register patient for Today's OPD visit.</div></div><button class="close" onclick="closeModal()">×</button></div><div class="banner"><b>Enter patient details.</b> The patient will be saved to Today's OPD queue. Reception can click <b>Check-in</b> when ready.</div><form onsubmit="saveNewPatient(event)"><div class="formgrid"><div class="field"><label class="required">Full Name</label><input id="np-name" class="input" required></div><div class="field"><label class="required">Mobile</label><input id="np-mobile" class="input" required placeholder="10 digit mobile"></div><div class="field"><label>Date of Birth</label><input id="np-dob" type="date" class="input" onchange="calcAge()"></div><div class="field"><label class="required">Age</label><input id="np-age" type="number" min="0" class="input" required></div><div class="field"><label class="required">Gender</label><select id="np-gender" class="select"><option>Female</option><option>Male</option><option>Other</option></select></div>${multi()&&role!=='DOCTOR'?`<div class="field"><label class="required">Doctor</label><select id="np-doctor" class="select">${doctors.map(d=>`<option value="${d.id}">${d.full_name}</option>`).join('')}</select></div>`:''}<div class="field"><label>Referred By</label><select id="np-ref-type" class="select" onchange="toggleRef('np')"><option value="">None</option><option value="Doctor">Referring Doctor</option><option value="Patient">Patient</option><option value="Hospital/Clinic">Hospital / Clinic</option><option value="Other">Other</option></select></div><div class="field" id="np-ref-wrap" style="display:none"><label>Referring Name / Source</label><input id="np-ref-name" class="input" placeholder="Enter name or source"></div><div class="field"><label>Consultation Type</label><select id="np-ctype" class="select" onchange="fillSub('np-ctype','np-sub')">${Object.keys(SUBTYPES).map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Subtype</label><select id="np-sub" class="select"></select></div><div class="field full"><h3 style="margin:4px 0 10px">Today's Vitals <span class="subtle" style="font-size:12px;font-weight:400">(optional)</span></h3><div class="banner">Vitals can be entered here by the permitted staff member. If the doctor records them later, the same values will appear automatically in the doctor's consultation.</div><div class="formgrid"><div class="field"><label>Blood Pressure</label><input id="np-bp" class="input" placeholder="120/80"></div><div class="field"><label>Weight (kg)</label><input id="np-weight" type="number" step="0.1" class="input" oninput="npBMI()"></div><div class="field"><label>Height (cm)</label><input id="np-height" type="number" step="0.1" class="input" oninput="npBMI()"></div><div class="field"><label>BMI</label><input id="np-bmi" class="input" readonly></div><div class="field"><label>Temperature</label><input id="np-temp" type="number" step="0.1" class="input"></div><div class="field"><label>Pulse</label><input id="np-pulse" type="number" class="input"></div><div class="field"><label>SpO₂</label><input id="np-spo2" type="number" class="input"></div><div class="field"><label>Respiratory Rate</label><input id="np-resp" type="number" class="input"></div></div></div><div class="field full"><details><summary>Additional patient information (optional)</summary><div class="formgrid" style="margin-top:12px"><div class="field"><label>Address</label><textarea id="np-address" class="textarea" rows="2"></textarea></div><div class="field"><label>Allergies</label><textarea id="np-allergy" class="textarea" rows="2"></textarea></div><div class="field"><label>Emergency Contact</label><input id="np-emergency" class="input"></div><div class="field"><label>Blood Group</label><select id="np-blood" class="select"><option value="">Not known</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select></div></div></details></div></div><div class="actions" style="margin-top:16px"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save</button></div></form></div>`);fillSub('np-ctype','np-sub')}

function escapeHtml(str){
  if(str==null)return '';
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

function renderMedSuggestions(input,query){
  const box=input.parentElement.querySelector('.med-suggest-box');
  if(!box)return;
  const q=query.toLowerCase();
  let matches=[];
  if(q){
    matches=dbMedicines.filter(m=>m.name.toLowerCase().includes(q)||(m.generic_name&&m.generic_name.toLowerCase().includes(q)));
  }else{
    matches=dbMedicines.slice(0,8);
  }
  if(!matches.length&&!q){
    box.classList.add('hidden');
    return;
  }
  let html='';
  matches.slice(0,8).forEach((m,idx)=>{
    const metaParts=[];
    if(m.dosage_form)metaParts.push(m.dosage_form);
    if(m.default_timing)metaParts.push(m.default_timing);
    if(m.default_duration)metaParts.push(m.default_duration);
    if(m.default_food_relation)metaParts.push(m.default_food_relation);
    const metaStr=metaParts.join(' • ');
    html+=`<div class="med-suggest-item ${idx===0?'active':''}" data-med-id="${m.id}" onmousedown="pickMedSuggestion(this)"><div><strong>${escapeHtml(m.name)}</strong>${m.generic_name?`<span style="font-size:11px;color:#64748b;margin-left:5px">(${escapeHtml(m.generic_name)})</span>`:''}</div><div class="med-meta">${escapeHtml(metaStr)}</div></div>`;
  });
  if(q&&!matches.some(m=>m.name.toLowerCase()===q)){
    html+=`<div class="med-suggest-item ${!matches.length?'active':''}" style="color:var(--blue);font-style:italic;background:#f8fafc" onmousedown="pickNewMed(this)"><div><i class="fa-solid fa-plus-circle"></i> Add new medicine "<b>${escapeHtml(query)}</b>"</div><div class="med-meta">Will save to database on consultation completion</div></div>`;
  }
  box.innerHTML=html;
  box.classList.remove('hidden');

  if(q){
    clearTimeout(medSearchTimeout);
    medSearchTimeout=setTimeout(async()=>{
      try{
        const sResults=await api('/api/consultations/medicines?q='+encodeURIComponent(q));
        if(sResults&&sResults.length){
          sResults.forEach(sm=>{
            if(!dbMedicines.some(m=>m.id===sm.id))dbMedicines.push(sm);
          });
          if(document.activeElement===input&&(input.value||'').trim().toLowerCase()===q){
            renderMedSuggestions(input,q);
          }
        }
      }catch(e){}
    },250);
  }
}

function pickMedSuggestion(itemEl){
  const row=itemEl.closest('.medrow');
  if(!row)return;
  const medId=itemEl.dataset.medId;
  const med=dbMedicines.find(x=>x.id===medId);
  if(!med)return;
  const input=row.querySelector('.m-name');
  if(input)input.value=med.name;
  if(med.default_timing)row.querySelector('.m-dose').value=med.default_timing;
  if(med.default_duration)row.querySelector('.m-duration').value=med.default_duration;
  if(med.default_food_relation)row.querySelector('.m-food').value=med.default_food_relation;
  if(med.instructions&&!row.querySelector('.m-inst').value)row.querySelector('.m-inst').value=med.instructions;
  const box=row.querySelector('.med-suggest-box');
  if(box)box.classList.add('hidden');
}

function pickNewMed(itemEl){
  const row=itemEl.closest('.medrow');
  if(!row)return;
  const box=row.querySelector('.med-suggest-box');
  if(box)box.classList.add('hidden');
}

function onMedKeydown(e,input){
  const box=input.parentElement.querySelector('.med-suggest-box');
  if(!box||box.classList.contains('hidden'))return;
  const items=[...box.querySelectorAll('.med-suggest-item')];
  if(!items.length)return;
  const currentIdx=items.findIndex(el=>el.classList.contains('active'));
  if(e.key==='ArrowDown'){
    e.preventDefault();
    const nextIdx=(currentIdx+1)%items.length;
    items.forEach((el,idx)=>el.classList.toggle('active',idx===nextIdx));
    items[nextIdx].scrollIntoView({block:'nearest'});
  }else if(e.key==='ArrowUp'){
    e.preventDefault();
    const prevIdx=(currentIdx-1+items.length)%items.length;
    items.forEach((el,idx)=>el.classList.toggle('active',idx===prevIdx));
    items[prevIdx].scrollIntoView({block:'nearest'});
  }else if(e.key==='Enter'||e.key==='Tab'){
    if(currentIdx>=0&&items[currentIdx]){
      e.preventDefault();
      items[currentIdx].dispatchEvent(new MouseEvent('mousedown'));
    }
  }else if(e.key==='Escape'){
    box.classList.add('hidden');
  }
}

async function completeConsult(e){
  if(e)e.preventDefault();
  const diagInput=document.getElementById('c-diagnosis');
  const diagnosis=(diagInput?.value||'').trim();
  if(!diagnosis){
    toast('Clinical diagnosis is required before completing consultation.');
    diagInput?.focus();
    return;
  }
  const symptoms=(document.getElementById('c-symptoms').value||'').split(',').map(x=>x.trim()).filter(Boolean);
  const prescription=[...document.querySelectorAll('#meds .medrow')].map(r=>({
    medicine_name:(r.querySelector('.m-name')?.value||'').trim(),
    dosage:r.querySelector('.m-dose')?.value||'1-0-1',
    frequency:'',
    duration:r.querySelector('.m-duration')?.value||'5 Days',
    food_relation:r.querySelector('.m-food')?.value||'After Food',
    instructions:(r.querySelector('.m-inst')?.value||'').trim()
  })).filter(x=>x.medicine_name);

  const btnRx=document.getElementById('btn-complete-rx');
  if(btnRx){
    btnRx.disabled=true;
    btnRx.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Generating Prescription...';
  }

  try{
    const d=await api('/api/consultations/complete',{
      method:'POST',
      body:JSON.stringify({
        appointment_id:currentAppt.id,
        symptoms,
        diagnosis,
        prescription,
        blood_pressure:document.getElementById('c-bp').value||null,
        weight:+document.getElementById('c-weight').value||null,
        height:+document.getElementById('c-height').value||null,
        bmi:+document.getElementById('c-bmi').value||null,
        temperature:+document.getElementById('c-temp').value||null,
        pulse_rate:+document.getElementById('c-pulse').value||null,
        spo2:+document.getElementById('c-spo2').value||null,
        respiratory_rate:+document.getElementById('c-resp').value||null,
        follow_up_date:document.getElementById('c-follow').value||null,
        notes:document.getElementById('c-notes').value||'',
        consultation_type:currentAppt.consultation_type,
        consultation_subtype:currentAppt.consultation_subtype
      })
    });
    completedApptId=currentAppt.id;
    completedPatientName=currentPatient?.full_name||'Patient';
    toast('Consultation completed! Prescription generated.');
    printPrescription(d.id);
    loadMedicines();
    if(btnRx){
      btnRx.disabled=true;
      btnRx.innerHTML='<i class="fa-solid fa-circle-check"></i> Consultation Completed';
      btnRx.classList.remove('primary');
      btnRx.style.opacity='0.7';
      btnRx.style.cursor='default';
    }
    const btnBill=document.getElementById('btn-go-billing');
    if(btnBill){
      btnBill.disabled=false;
      btnBill.style.opacity='1';
      btnBill.style.cursor='pointer';
      btnBill.title='Proceed to billing for this completed visit';
    }
    const banner=document.getElementById('consult-success-banner');
    if(banner){banner.classList.remove('hidden')}
  }catch(err){
    toast(err.message);
    if(btnRx){
      btnRx.disabled=false;
      btnRx.innerHTML='<i class="fa-solid fa-file-prescription"></i> Complete & Generate Prescription';
    }
  }
}

async function goToBilling(){
  const btnBill=document.getElementById('btn-go-billing');
  if(btnBill?.disabled){
    toast('Please complete consultation & generate prescription first.');
    return;
  }
  if(!completedApptId&&!currentAppt){
    toast('No completed consultation found to bill.');
    return;
  }
  const apptId=completedApptId||currentAppt?.id;
  const pName=completedPatientName||currentPatient?.full_name||'Patient';
  currentAppt=null;
  currentPatient=null;
  completedApptId=null;
  await show('billing');
  if(apptId){
    bill(apptId,pName);
  }
}

async function saveNewAppointment(){const name=document.getElementById('bnp-name').value.trim(),mobile=document.getElementById('bnp-mobile').value.trim(),age=document.getElementById('bnp-age').value;if(!name||!mobile||!age){toast('Name, mobile and age are required.');return}const apptDate=document.getElementById('bnp-date').value;if(!apptDate||apptDate<getLocalTodayStr()){toast('Past dates cannot be selected.');return}const apptTime=document.getElementById('bnp-time').value;if(!apptTime){toast('Please select an available time slot.');return}try{const patient=await api('/api/patients/register',{method:'POST',body:JSON.stringify({full_name:name,mobile:mobile,date_of_birth:document.getElementById('bnp-dob').value||new Date(new Date().setFullYear(new Date().getFullYear()-Number(age))).toISOString().slice(0,10),age:Number(age),gender:document.getElementById('bnp-gender').value,referred_by:document.getElementById('bnp-ref-name')?.value||null})});const d=await api('/api/queue/book',{method:'POST',body:JSON.stringify({patient_id:patient.id,doctor_id:document.getElementById('bnp-doctor')?.value||null,appointment_date:apptDate,scheduled_time:apptTime+':00',visit_type:'New Patient',consultation_type:document.getElementById('bnp-ctype').value,consultation_subtype:document.getElementById('bnp-sub').value,referred_by_type:document.getElementById('bnp-ref-type')?.value||null,referred_by_name:document.getElementById('bnp-ref-name')?.value||null,check_in_now:false})});closeModal();toast(d.queue_token?`New patient appointment booked • Token ${d.queue_token}`:'New patient appointment booked.');await show('today')}catch(e){toast(e.message)}}
async function renderPatients(c){let ps=[];try{ps=await api('/api/patients/search?q=')}catch(e){}c.innerHTML=`<div class="grid grid-2"><div class="card"><div class="patient-head"><div><h2>Patient Directory</h2><div class="subtle">Search existing patients before registering anyone new.</div></div><button class="btn primary" onclick="newPatient()">+ New Patient</button></div><div class="actions" style="margin-top:15px"><input id="dir-q" class="input" placeholder="Name / mobile / patient ID" oninput="directorySearch()"></div><div id="dir-results" style="margin-top:14px">${directoryHtml(ps.slice(0,20))}</div></div><div class="card"><h3>Quick rule</h3><div class="banner">If a mobile number already exists, the system must guide the user to the existing patient and start a new visit. Never create a duplicate patient profile.</div><h3>Follow-up</h3><p class="subtle">Open the patient's previous history first, then create a new Follow-up visit. Previous consultation records remain read-only history.</p></div></div>`}
function directoryHtml(ps){if(!ps.length)return '<div class="empty">No patients found.</div>';return `<table class="table"><thead><tr><th>Patient</th><th>Mobile</th><th>Age/Gender</th><th></th></tr></thead><tbody>${ps.map(p=>`<tr><td><b>${p.full_name}</b><div class="subtle">${p.patient_number}</div></td><td>${p.mobile_normalized}</td><td>${p.age} / ${p.gender}</td><td><button class="btn small" style="margin-right:4px" onclick="openPatientHistoryModal('${p.id}','${p.full_name.replace(/'/g,"\\'")}')"><i class="fa-solid fa-clock-rotate-left"></i> History</button><button class="btn small primary" onclick="followup('${p.id}')">Follow-up</button></td></tr>`).join('')}</tbody></table>`}
async function directorySearch(){const q=document.getElementById('dir-q').value;try{const ps=await api('/api/patients/search?q='+encodeURIComponent(q));document.getElementById('dir-results').innerHTML=directoryHtml(ps)}catch(e){toast(e.message)}}
async function renderBilling(c){let data=[];let inv=[];try{data=await api('/api/billing/pending-visits')}catch(e){}try{inv=await api('/api/billing/invoices')}catch(e){}c.innerHTML=`<div class="grid grid-2"><div class="card"><h2>Payment Desk</h2><div class="subtle">The doctor or receptionist can collect payment when permission is enabled. No separate Billing role.</div><div class="banner" style="margin-top:12px">For a single-doctor clinic, the doctor can complete consultation and collect payment directly. For a hospital, Reception can collect after the doctor completes the visit.</div><h3>Visits Awaiting Billing</h3>${data.length?data.map(x=>`<div class="queue-row" style="grid-template-columns:1fr 1fr 150px"><div><b>${x.patient?.full_name||'Patient'}</b><div class="subtle">${x.patient?.patient_number||''}</div></div><div>${x.appointment.consultation_type}</div><div><button class="btn small primary" onclick="bill('${x.appointment.id}','${(x.patient?.full_name||'Patient').replace(/'/g,"\'")}')">Create Bill</button></div></div>`).join(''):'<div class="empty">No completed visits awaiting billing.</div>'}</div><div class="card"><h3>Recent Invoices</h3>${inv.length?`<table class="table"><thead><tr><th>Invoice</th><th>Total</th><th>Status</th><th>Receipt</th></tr></thead><tbody>${inv.slice(0,15).map(i=>`<tr><td>${i.invoice_number}</td><td>₹${i.total_amount}</td><td>${i.payment_status}</td><td><button class="btn small" onclick="printReceipt('${i.id}','en')">Print</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">No invoices yet.</div>'}</div></div>`}

function bill(id,pname){openModal(`<div class="modalbox" style="max-width:650px"><div class="modalhead"><div><h2>Collect Payment</h2><div class="subtle">${pname}</div></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="createBill(event,'${id}')"><div class="formgrid"><div class="field"><label>Consultation Fee (₹)</label><input id="b-fee" type="number" step="0.01" value="500" class="input"></div><div class="field"><label>Discount (₹)</label><input id="b-disc" type="number" step="0.01" value="0" class="input"></div><div class="field"><label>Payment Mode</label><select id="b-mode" class="select"><option>CASH</option><option>UPI</option><option>CARD</option></select></div><div class="field"><label>Amount Received (₹)</label><input id="b-paid" type="number" step="0.01" placeholder="Leave blank for full amount" class="input"></div></div><div class="actions" style="margin-top:16px"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn success">Generate Receipt & Save Payment</button></div></form></div>`)}
async function createBill(e,id){e.preventDefault();const fee=+document.getElementById('b-fee').value||0,disc=+document.getElementById('b-disc').value||0,mode=document.getElementById('b-mode').value,paid=document.getElementById('b-paid').value;try{const inv=await api('/api/billing/invoice',{method:'POST',body:JSON.stringify({appointment_id:id,items:[],consultation_charges:fee,medicine_charges:0,lab_charges:0,discount_amount:disc,payment_mode:mode,payment_status:'PENDING'})});await api('/api/billing/invoice/'+inv.id+'/pay',{method:'POST',body:JSON.stringify({payment_mode:mode,amount:paid?+paid:null})});toast('Payment saved and receipt generated.');closeModal();await show('billing')}catch(e){toast(e.message)}}
function printReceipt(id,lang){window.open(`${API_BASE}/api/billing/invoice/${id}/print?lang=${lang}&token=${encodeURIComponent(token)}`,'_blank')}
async function renderAdmin(c){if(role!=='ADMIN'){c.innerHTML='<div class="banner warn">Admin access only.</div>';return}c.innerHTML=`<div class="grid grid-2"><div class="card"><h2>Clinic Users</h2><div class="subtle">Only Admin can create/manage Doctor and Receptionist accounts.</div><div class="actions" style="margin-top:14px"><button class="btn primary" onclick="addUser()">+ Add User</button></div><div id="users" style="margin-top:14px">Loading...</div></div><div class="card"><h2>Workflow Settings</h2><div class="banner">Doctor count controls OPD behavior automatically. <b>1 active doctor = direct consultation, no token.</b> <b>2+ active doctors = token + queue.</b></div><div class="field"><label>Vitals entered by</label><select id="vc-role" class="select"><option>Doctor</option><option>Receptionist</option><option>Both</option></select></div><button class="btn primary" style="margin-top:10px" onclick="saveVConfig()">Save Vitals Rule</button></div></div>`;loadUsers();loadVConfig()}
async function loadUsers(){try{const u=await api('/api/auth/users');document.getElementById('users').innerHTML=`<table class="table"><thead><tr><th>Name</th><th>Role</th><th>Status</th><th>Vitals</th><th>Payment</th></tr></thead><tbody>${u.map(x=>`<tr><td>${x.full_name}</td><td>${x.role}</td><td>${x.status}</td><td>${x.can_enter_vitals?'Yes':'No'}</td><td>${x.can_collect_payment?'Yes':'No'}</td></tr>`).join('')}</tbody></table>`}catch(e){document.getElementById('users').textContent=e.message}}
function addUser(){openModal(`<div class="modalbox" style="max-width:600px"><div class="modalhead"><h2>Add Clinic User</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveUser(event)"><div class="formgrid"><div class="field"><label>Full Name</label><input id="u-name" class="input" required></div><div class="field"><label>Username</label><input id="u-user" class="input" required></div><div class="field"><label>Password</label><input id="u-pass" class="input" required></div><div class="field"><label>Role</label><select id="u-role" class="select"><option>DOCTOR</option><option>RECEPTIONIST</option></select></div><div class="field"><label>Can collect payment</label><select id="u-pay" class="select"><option value="true">Yes</option><option value="false">No</option></select></div><div class="field"><label>Can enter vitals</label><select id="u-vit" class="select"><option value="true">Yes</option><option value="false">No</option></select></div></div><div class="actions" style="margin-top:16px"><button class="btn" type="button" onclick="closeModal()">Cancel</button><button class="btn primary">Create User</button></div></form></div>`)}
async function saveUser(e){e.preventDefault();try{await api('/api/auth/register',{method:'POST',body:JSON.stringify({username:document.getElementById('u-user').value,password:document.getElementById('u-pass').value,full_name:document.getElementById('u-name').value,role:document.getElementById('u-role').value,can_collect_payment:document.getElementById('u-pay').value==='true',can_enter_vitals:document.getElementById('u-vit').value==='true',can_view_clinical_history:document.getElementById('u-role').value==='DOCTOR',can_edit_clinical_data:document.getElementById('u-role').value==='DOCTOR'})});toast('User created.');closeModal();await loadDoctors();renderNav();show('admin')}catch(e){toast(e.message)}}
async function loadVConfig(){try{const d=await api('/api/vitals/config');document.getElementById('vc-role').value=d.recorder_role==='ANY'?'Both':d.recorder_role}catch(e){}}
async function saveVConfig(){try{await api('/api/vitals/config',{method:'POST',body:JSON.stringify({recorder_role:document.getElementById('vc-role').value})});toast('Vitals workflow updated.')}catch(e){toast(e.message)}}
function openModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modal').classList.remove('hidden')};function closeModal(){document.getElementById('modal').classList.add('hidden');document.getElementById('modal').innerHTML=''}
document.addEventListener('click',e=>{if(!e.target.closest('.medrow')||(!e.target.classList.contains('m-name')&&!e.target.closest('.med-suggest-box'))){document.querySelectorAll('.med-suggest-box').forEach(b=>b.classList.add('hidden'))}});
window.addEventListener('load',async()=>{try{const s=JSON.parse(localStorage.getItem('dhan_session')||'null');if(s){({token,role,name,uid,canPay,canVitals,canClinicalView,canClinicalEdit}=s);const me=await api('/api/auth/me');if(me){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');await boot()}}}catch(e){localStorage.removeItem('dhan_session')}})
</script>
</body></html>
